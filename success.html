<!DOCTYPE html>
<html>
<head>
    <title>TagAlong AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 TagAlong AI</h1>

        <h2>✅ Item Added Successfully</h2>

        <p id="addedItems"></p>

        <hr>

        <h3>🔔 Delivery Partner Notification</h3>

        <p>
            Your delivery partner has been notified.
        </p>

        <p>
            📦 Order #TA1025
        </p>

        <p>
            🚚 Delivery partner will be alerted about the additional item.
        </p>

    </div>

    <script>
        let items = localStorage.getItem("forgottenItems");

        document.getElementById("addedItems").innerText =
            "Added item: " + items;
    </script>

</body>
</html>
