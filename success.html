<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TagAlong AI - Success</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 TagAlong AI</h1>

        <h2>✅ Item Added Successfully!</h2>

        <p id="addedItems"></p>

        <hr>

        <h3>📦 Order #TA1025</h3>

        <p>
            Your additional items have been added to your current order.
        </p>

        <h3>🔔 Delivery Partner</h3>

        <p>
            The delivery partner has been notified about the additional items.
        </p>

        <br>

        <button onclick="goToPayment()">
            💳 Pay for Additional Items
        </button>

    </div>

    <script>

        // Get the items entered by the customer
        let items = localStorage.getItem("forgottenItems");

        if (items) {
            document.getElementById("addedItems").innerText =
                "Added items: " + items;
        } else {
            document.getElementById("addedItems").innerText =
                "Additional items added to your order.";
        }

        // Open payment page
        function goToPayment() {
            window.location.href = "payment.html";
        }

    </script>

</body>

</html>
